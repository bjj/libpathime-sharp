name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# Tag vX.Y.Z → build natives (same cache as CI, via the shared action) and
# run the packed-package consumer test on each platform → pack everything,
# bundle the demo and the Unity .tgz, attest, and open a DRAFT GitHub
# Release → wait at the nuget-production environment → push to NuGet.
#
# The gate is the point: NuGet.org cannot delete, only unlist, so nothing
# reaches it until a human has approved the `push` job — review the draft
# release first. The environment (Settings → Environments →
# nuget-production) carries a required reviewer and is restricted to v*
# tags; the workflow only names it.
#
# NuGet auth is Trusted Publishing (OIDC), not a stored API key: a policy
# on nuget.org (owner bjj / repo libpathime-sharp / workflow release.yml)
# trades this workflow's OIDC token for a one-hour key at push time. The
# NUGET_USER secret holds the nuget.org profile name the policy belongs to.

jobs:
  natives:
    name: natives (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Image choices match ci.yml — same reasoning, and the same cache
          # keys, so a release tagged on a CI-green commit rebuilds nothing.
          - os: windows-2022
            rid: win-x64
            timeout: 90
          - os: ubuntu-22.04
            rid: linux-x64
            timeout: 30
    steps:
      - name: Force LF checkout
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build and stage native libpathime
        uses: ./.github/actions/native
        with:
          rid: ${{ matrix.rid }}
          image: ${{ matrix.os }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      # The same consumer test CI runs, on the exact trees this release
      # ships: packed packages into a local feed, a consumer that references
      # only the NativeAssets package, run + RID publish + RID-less publish.
      - name: Consumer test from packed packages
        shell: pwsh
        run: scripts/test-packages.ps1 -Rid ${{ matrix.rid }}
      - name: Upload staged native tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/nuget/${{ matrix.rid }}
          if-no-files-found: error

  release:
    needs: natives
    # windows: nuget.exe is preinstalled, and the nuspecs are packed with it.
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The PathimeSharp package is pure managed code compiled from the repo;
      # the natives arrive as artifacts. No submodules needed — the version
      # check reads the submodule pin from the superproject tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Tag ↔ csproj ↔ nuspecs ↔ Unity package.json ↔ submodule pin. The
      # packs below override versions from the tag, but Unity git-URL
      # consumers receive exactly what package.json says — so everything
      # has to actually agree, not merely be overridden.
      - name: Version-bearing files agree with the tag
        shell: bash
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Download staged native trees
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: artifacts/nuget
      # download-artifact writes native-<rid>/; the nuspecs read <rid>/.
      - name: Restore staged tree layout
        shell: pwsh
        run: Get-ChildItem artifacts/nuget -Directory | Rename-Item -NewName { $_.Name -replace '^native-', '' }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Pack PathimeSharp
        run: >-
          dotnet pack src/PathimeSharp/PathimeSharp.csproj -c Release
          -p:Version=${{ steps.ver.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          -o artifacts/release
      # -Properties version= feeds the $version$ token in the nuspecs'
      # exact-pin dependency on PathimeSharp.
      - name: Pack native-assets packages
        run: |
          nuget pack packaging/PathimeSharp.NativeAssets.win-x64/PathimeSharp.NativeAssets.win-x64.nuspec -Version ${{ steps.ver.outputs.version }} -Properties version=${{ steps.ver.outputs.version }} -OutputDirectory artifacts/release -NoDefaultExcludes
          nuget pack packaging/PathimeSharp.NativeAssets.linux-x64/PathimeSharp.NativeAssets.linux-x64.nuspec -Version ${{ steps.ver.outputs.version }} -Properties version=${{ steps.ver.outputs.version }} -OutputDirectory artifacts/release -NoDefaultExcludes

      # The runnable demo: self-contained publish (no SDK needed to run it),
      # with the staged natives, dictionaries and notices flat beside the
      # exe — pathime.dll loads via default probing from the exe directory.
      - name: Bundle the demo (win-x64, self-contained)
        shell: pwsh
        run: |
          $bundle = "artifacts/demo/PathimeSharp.Demo-${{ steps.ver.outputs.version }}-win-x64"
          dotnet publish demo/PathimeSharp.Demo -c Release -r win-x64 --self-contained true -v q -o $bundle
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item artifacts/nuget/win-x64/native/*.dll $bundle/
          Copy-Item -Recurse artifacts/nuget/win-x64/data/pathime-data $bundle/pathime-data
          Copy-Item -Recurse artifacts/nuget/win-x64/licenses $bundle/licenses
          Copy-Item packaging/demo/THIRD-PARTY.md $bundle/
          Compress-Archive -Path $bundle -DestinationPath "artifacts/release/PathimeSharp.Demo-${{ steps.ver.outputs.version }}-win-x64.zip"

      # The installable Unity channel: the UPM package with both platforms'
      # natives staged in, exactly as scripts/stage-native.* lay them out
      # locally (trailing ~ hides data and notices from Unity's importer).
      # GPL-3 as distributed — the dictionaries ride inside — which the
      # release notes state.
      - name: Bundle the Unity package (.tgz with natives)
        shell: pwsh
        run: |
          $pkg = "unity/com.ben.pathime"
          foreach ($p in @(@("Windows", "win-x64", "*.dll"), @("Linux", "linux-x64", "*.so*"))) {
            $dest = "$pkg/Plugins/$($p[0])/x86_64"
            New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item "artifacts/nuget/$($p[1])/native/$($p[2])" $dest/
            Copy-Item -Recurse "artifacts/nuget/$($p[1])/data/pathime-data" "$dest/pathime-data~"
            Copy-Item -Recurse "artifacts/nuget/$($p[1])/licenses" "$dest/licenses~"
          }
          npm pack ./$pkg --pack-destination artifacts/release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/release/*

      # Drafted BEFORE anything is pushed anywhere: review this, then approve
      # the push job below.
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --draft
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --notes "Unity: \`com.ben.pathime-${GITHUB_REF_NAME#v}.tgz\` is the UPM package with win-x64/linux-x64 natives and dictionaries inside — GPL-3 as distributed. The NuGet packages and the demo bundle carry the same natives."
          artifacts/release/*.nupkg artifacts/release/*.zip artifacts/release/*.tgz

      - name: Upload packages for the push job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: artifacts/release/*.nupkg
          if-no-files-found: error

  # Held by the nuget-production environment's required reviewer. Everything
  # above ran already; approving this job is the single irreversible step.
  push:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget-production
    permissions:
      id-token: write # OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: packages
      # The temporary key lives one hour — log in right before the push.
      - name: NuGet login (OIDC → temp API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push packages to NuGet
        run: |
          for f in packages/*.nupkg; do
            dotnet nuget push "$f" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
