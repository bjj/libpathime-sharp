name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The native build lives in .github/actions/native — shared with release.yml
# so the two can never drift. Its recipes mirror libpathime's own CI
# (libpathime/.github/workflows/ci.yml): pinned CMake for the same
# runner-drift reason, the same vcpkg cache split, the same LF-before-checkout
# rule. What it adds is the install-prefix cache keyed on the submodule
# commit: a C#-only push restores the finished `cmake --install` tree and
# never touches CMake at all.

jobs:
  test:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022, not -latest: the windows-msvc preset pins the
          # Visual Studio 17 generator and the 2025 image ships only 18.
          # The preset's serial build (jobs:1) makes a cache-miss run slow,
          # but only a submodule bump misses.
          - os: windows-2022
            rid: win-x64
            timeout: 90
          # 22.04 deliberately trails upstream's 24.04: the .so this job
          # stages is what PathimeSharp.NativeAssets.linux-x64 will ship,
          # so build against the oldest glibc still on GitHub's fleet.
          - os: ubuntu-22.04
            rid: linux-x64
            timeout: 30
    steps:
      # The runner images configure core.autocrlf=true and the submodule
      # needs an LF checkout — anthy's dictionary codegen parses tokens with
      # stray CRs otherwise. Attributes cannot cross the submodule boundary,
      # so: before checkout.
      - name: Force LF checkout
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build and stage native libpathime
        uses: ./.github/actions/native
        with:
          rid: ${{ matrix.rid }}
          image: ${{ matrix.os }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      # xUnit parallelization is disabled assembly-wide — the library forbids
      # overlapping calls. Never re-enable it.
      - name: Test
        run: dotnet test

      - name: Version-bearing files agree
        shell: bash
        run: scripts/check-release-version.sh

      # The packages users install, not the staged tree: pack all three, put
      # them in a local feed, and run a consumer that references only the
      # NativeAssets package (PathimeSharp must arrive through its
      # dependency) as a build, a RID publish, and a RID-less publish.
      - name: Consumer test from packed packages
        shell: pwsh
        run: scripts/test-packages.ps1 -Rid ${{ matrix.rid }}

      # Input for the release job and for local debugging: the nuspec source
      # layout (native libs + pathime-data), exactly as staged.
      - name: Upload staged native tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/nuget/${{ matrix.rid }}
          if-no-files-found: error
