name: Build and stage native libpathime
description: >-
  Restore (or build) the libpathime install prefix for this runner, cached on
  the submodule commit, then stage it into the repo's package layouts. The
  build recipes mirror libpathime's own CI (pinned CMake, the vcpkg cache
  split); see .github/workflows/ci.yml for the reasoning. Requires the
  repository checked out with submodules: recursive — and on Windows an LF
  checkout (git config --global core.autocrlf false BEFORE checkout): anthy's
  dictionary codegen parses tokens with stray CRs otherwise.

inputs:
  rid:
    description: .NET runtime identifier being built (win-x64 or linux-x64)
    required: true
  image:
    description: >-
      Runner image label (e.g. windows-2022), part of every cache key: the
      images build with different toolsets, so neither the vcpkg tree nor the
      install prefix may cross an image boundary.
    required: true
  cmake-version:
    description: Pinned CMake, so a runner-image refresh cannot change the build
    default: 4.2.3
  cache-version:
    description: Bump to invalidate the native install cache when the recipe changes
    default: v1

runs:
  using: composite
  steps:
    - name: Resolve submodule pin
      id: pin
      shell: bash
      run: echo "sha=$(git rev-parse HEAD:libpathime)" >> "$GITHUB_OUTPUT"

    # The whole point: the finished install prefix, keyed on the submodule
    # commit. Exact-match only — a prefix from any other commit is useless.
    - name: Restore native install
      id: native
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: native-prefix
        key: native-${{ inputs.rid }}-${{ inputs.image }}-${{ steps.pin.outputs.sha }}-${{ inputs.cache-version }}

    # ---- native build (cache miss only) ----
    - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
      if: steps.native.outputs.cache-hit != 'true'
      with:
        cmake-version: ${{ inputs.cmake-version }}

    - name: Install native dependencies (apt)
      if: runner.os == 'Linux' && steps.native.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build pkg-config \
          libsqlite3-dev uuid-dev

    - name: Resolve vcpkg baseline
      if: runner.os == 'Windows' && steps.native.outputs.cache-hit != 'true'
      id: vcpkg
      shell: pwsh
      run: echo "rev=$(git -C C:\vcpkg rev-parse HEAD)" >> $env:GITHUB_OUTPUT
    # restore/save rather than the combined action: the combined form saves
    # only when the whole job succeeds, and a later failure must not throw
    # away the from-source builds. The prefix fallback
    # restores the newest previous tree when the image's vcpkg rev moved,
    # making `vcpkg install` a near-no-op.
    - name: Restore vcpkg installed tree
      if: runner.os == 'Windows' && steps.native.outputs.cache-hit != 'true'
      id: vcpkg-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: C:\vcpkg\installed
        key: vcpkg-${{ inputs.image }}-${{ steps.vcpkg.outputs.rev }}
        restore-keys: vcpkg-${{ inputs.image }}-
    - name: Install external dependencies (vcpkg)
      if: runner.os == 'Windows' && steps.native.outputs.cache-hit != 'true'
      shell: pwsh
      run: vcpkg install sqlite3:x64-windows-static-md
    - name: Save vcpkg installed tree
      if: runner.os == 'Windows' && steps.native.outputs.cache-hit != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: C:\vcpkg\installed
        key: vcpkg-${{ inputs.image }}-${{ steps.vcpkg.outputs.rev }}

    - name: Build and install libpathime (Windows)
      if: runner.os == 'Windows' && steps.native.outputs.cache-hit != 'true'
      working-directory: libpathime
      # VCPKG_ROOT on the step: the preset reads it. The install prefix is
      # passed at configure time, as the preset's own description requires.
      # && so a configure failure fails the step: pwsh does not stop on a
      # native command's exit code mid-step.
      env:
        VCPKG_ROOT: C:\vcpkg
      shell: pwsh
      run: >-
        cmake --preset windows-msvc "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\native-prefix" &&
        cmake --build --preset windows-msvc &&
        cmake --install build/windows-msvc --config Release

    - name: Build and install libpathime (Linux)
      if: runner.os == 'Linux' && steps.native.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cmake -S libpathime -B libpathime/build/ci -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/native-prefix"
        cmake --build libpathime/build/ci
        cmake --install libpathime/build/ci

    # Save immediately: a failure later in the job must not discard the build.
    - name: Save native install
      if: steps.native.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: native-prefix
        key: native-${{ inputs.rid }}-${{ inputs.image }}-${{ steps.pin.outputs.sha }}-${{ inputs.cache-version }}

    # ---- stage into the repo's package layouts (every run) ----
    - name: Stage native (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: scripts\stage-native.ps1 -Prefix "${{ github.workspace }}\native-prefix"
    - name: Stage native (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: scripts/stage-native.sh "$GITHUB_WORKSPACE/native-prefix"
